<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Football Life</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="phone-shell">
      <div class="phone-notch" aria-hidden="true"></div>

      <div class="screen">
        <div class="screen-glow"></div>

        <div class="menu-panel-right">
          <div class="brand-mini">FYS</div>

          <div class="menu-stack">
            <button class="menu-btn active" data-action="play">
              Oyna
            </button>

            <button class="menu-btn" data-action="settings">
              Ayarlar
            </button>

            <button class="menu-btn" data-action="quit">
              Çıkış
            </button>
          </div>
        </div>

        <div id="gameStatus" class="status-bar" aria-live="polite">
          Football Life
        </div>
      </div>
    </div>

    <div id="settingsModal" class="modal hidden" aria-hidden="true">
      <div class="modal-card">
        <div class="modal-header">
          <h2>Ayarlar</h2>
          <button id="closeSettings" class="icon-btn" aria-label="Kapat">✕</button>
        </div>

        <div class="setting-row">
          <span>Ses</span>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <div class="setting-row">
          <span>Vibrasyon</span>
          <label class="switch">
            <input type="checkbox" checked />
            <span class="slider"></span>
          </label>
        </div>

        <button id="saveSettings" class="menu-btn small save-btn">Kaydet</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
